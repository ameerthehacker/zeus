name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Cache bdwgc
        uses: actions/cache@v4
        with:
          path: third_party/bdwgc
          key: bdwgc-${{ runner.os }}-v8.2.12

      - name: Build bdwgc
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && make -C build

      - name: Run tests
        run: make test
