name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install LLVM
        run: |
          brew install llvm@19
          echo "LLVM_PATH=$(brew --prefix llvm@19)" >> $GITHUB_ENV

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Build Zig runtime
        run: make build-runtime-release

      - name: Build Zeus binary
        run: make build-release VERSION="${GITHUB_REF_NAME#v}" LLVM_CONFIG="${LLVM_PATH}/bin/llvm-config"

      - name: Create release package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          PACKAGE_NAME="zeus-${VERSION}-darwin-${ARCH}"

          mkdir -p "${PACKAGE_NAME}/bin"
          mkdir -p "${PACKAGE_NAME}/runtime/zig-out"
          mkdir -p "${PACKAGE_NAME}/lib"

          cp bin/zeus "${PACKAGE_NAME}/bin/"
          cp -r runtime/zig-out "${PACKAGE_NAME}/runtime/"
          cp -r lib/std "${PACKAGE_NAME}/lib/"

          tar -czvf "${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"
          shasum -a 256 "${PACKAGE_NAME}.tar.gz" | awk '{print $1}' > "${PACKAGE_NAME}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeus-darwin-${{ matrix.arch }}
          path: |
            zeus-*-darwin-${{ matrix.arch }}.tar.gz
            zeus-*-darwin-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version and checksums
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM64_SHA256=$(cat "artifacts/zeus-${VERSION}-darwin-arm64.sha256")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "arm64_sha256=${ARM64_SHA256}" >> $GITHUB_OUTPUT

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: ameerthehacker/homebrew-zeus
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-zeus

      - name: Update Homebrew formula
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARM64_SHA256="${{ steps.meta.outputs.arm64_sha256 }}"

          cd homebrew-zeus
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/zeus.rb
          sed -i "/on_arm do/{n;n;s/sha256 \"[a-f0-9]*\"/sha256 \"${ARM64_SHA256}\"/}" Formula/zeus.rb
          sed -i "/on_intel do/{n;n;s/sha256 \"[a-f0-9]*\"/sha256 \"${ARM64_SHA256}\"/}" Formula/zeus.rb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add Formula/zeus.rb
          git commit -m "chore: update formula to v${VERSION}"
          git push

      - name: Generate release notes
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          ARM64_SHA256="${{ steps.meta.outputs.arm64_sha256 }}"

          cat << EOF > release_notes.md
          ## Zeus v${VERSION}

          ### Installation

          **Via Homebrew (recommended):**
          \`\`\`bash
          brew tap ameerthehacker/zeus
          brew install zeus
          \`\`\`

          **Manual installation:**
          1. Download the archive for your Mac
          2. Extract: \`tar -xzf zeus-${VERSION}-darwin-arm64.tar.gz\`
          3. Add the \`bin\` directory to your PATH

          > **Note:** Intel Macs can run the ARM64 binary via Rosetta 2.

          ### Checksum

          | Architecture | SHA256 |
          |--------------|--------|
          | arm64 | \`${ARM64_SHA256}\` |
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Zeus v${{ steps.meta.outputs.version }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.version, '-') }}
          files: |
            artifacts/*.tar.gz
          body_path: release_notes.md
